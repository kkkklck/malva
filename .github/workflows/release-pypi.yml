name: release-pypi

# Publishes the version already in pyproject.toml to PyPI. The actual build lives
# in build-wheels.yml (which also runs on every pull request, without
# publishing), so this workflow builds and then publishes.
#
# Run it from a green main, either manually or by pushing a vX.Y.Z tag. See
# PUBLISHING.md for the one-time PyPI trusted-publisher / API-token setup.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built artifacts to PyPI (uncheck for a build-only run)
        type: boolean
        default: true
  push:
    tags: ["v*"]

# Never run two releases for the same ref at once.
concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-wheels.yml

  publish:
    needs: [build]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/malva
    permissions:
      # OIDC trusted publishing: lets PyPI verify this workflow without a token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        # Without trusted publishing, drop the id-token permission above and use
        # an API token instead (see PUBLISHING.md):
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
