[build-system]
requires = ["poetry-core>=1.0.8", "Cython>=0.29.21", "setuptools", "wheel", "numpy>=1.17.0", "pkgconfig"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "malva"
version = "1.1.2"
description = "malva: fast indexing and querying of genomic sequences from single-cell omics data"
license = "LicenseRef-Malva-Academic-NonCommercial"
authors = [
    "Daniel León-Periñán <daniel.leonperinan@mdc-berlin.de>",
    "Nikolaos Karaiskos <nikolaos.karaiskos@mdc-berlin.de>",
]
maintainers = [
    "Daniel León-Periñán <daniel.leonperinan@mdc-berlin.de>",
    "Nikolaos Karaiskos <nikolaos.karaiskos@mdc-berlin.de>",
]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
include = [
    "malva/data/*.yaml",
    "malva/serve/static/index.html",
    "include/ankerl/*.h",
]

[tool.poetry.build]
script = "build_extensions.py"
generate-setup-file = true

[tool.poetry.dependencies]
python = ">=3.9,<3.15"
numpy = ">=1.17.0"
pandas = ">=1.0"
dnaio = ">1.0.0"
xopen = ">=1.7.0"
h5py = ">=3"
rich = ">13.0"
setproctitle = ">1.0"
tifffile = ">2022.4.8"
pyyaml = ">5.4"
datashader = ">0.15.0"
flask = ">2.3.0"
flask_session = ">=0.8.0"
flask_cors = ">=6.0.2"
scikit-image = ">=0.24.0"
ollama = ">=0.3.1"
tqdm = ">=4.66.6"
anndata = ">=0.10.0"
matplotlib = ">=3.5"
scanpy = ">=1.9"
scipy = ">=1.7"
scikit-learn = ">=1.0"
requests = ">=2.26"
pillow = ">=9.0"
werkzeug = ">=2.0"

[tool.poetry.extras]
# pip install 'malva[sra]'   — adds SRA archive support (requires sra-tools on PATH)
sra = ["sra-reader"]
# pip install 'malva[bam]'   — adds BAM file support
bam = ["pysam"]
# pip install 'malva[all]'   — all optional input formats
all = ["sra-reader", "pysam"]

[tool.poetry.dependencies.sra-reader]
version = ">=0.1.0"
optional = true

[tool.poetry.dependencies.pysam]
version = ">=0.22.0"
optional = true

[tool.poetry.group.dev.dependencies]
Cython = "^0.29.21,<3.0.11"
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
coverage = ">=7.0.0"
pkgconfig = "*"
ruff = ">=0.16.9"
ty = ">=0.0.84"
deptry = ">=0.25.0"
pip-licenses = ">=5.0.0"

[tool.poetry.urls]
"Documentation" = "https://rajewsky-lab.github.io/malva"
"Source" = "https://github.com/rajewsky-lab/malva"
"Home-page" = "https://rajewsky-lab.github.io/malva"

[tool.poetry.scripts]
malva = 'malva.__main__:run_malva'

[tool.coverage.run]
plugins = ["Cython.Coverage"]
source = ["malva"]
parallel = true
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise Import.*"
]

[tool.coverage.html]
directory = "htmlcov"

# wheel building (cibuildwheel)
[tool.cibuildwheel]
# Build for CPython 3.9-3.12; skip 32-bit and musl targets
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
# Install Cython and numpy before building the extensions
before-build = "pip install 'cython>=3.0' 'numpy>=1.21'"
# Always build production wheels (no tracing hooks)
environment = {MALVA_DEBUG_BUILD = "0"}

[tool.cibuildwheel.linux]
# Build the Linux wheels WITHOUT io_uring. indexes.pyx only enables its io_uring
# path when <liburing.h> is present (and only links it then); the manylinux image
# ships an older liburing than that path needs, so make sure the header is absent
# and the code takes its pread fallback. macOS never has liburing and builds the
# same way. The source is unchanged -- this only affects the wheel build.
before-all = "rm -f /usr/include/liburing.h /usr/local/include/liburing.h; rm -rf /usr/include/liburing /usr/local/include/liburing; true"
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

# --- lint / type / test tooling ---

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["."]
# build/ holds Cython intermediates; docs/ and examples/ are not shipped code;
# setup.py is generated from pyproject.toml by build_scripts/generate_setup.py
# and must stay byte-identical to that output.
extend-exclude = ["build", "docs", "examples", "setup.py"]

[tool.ruff.lint]
# Deliberately narrow: import order + pyflakes + the E4/E7/E9
# statement/import classes. Style is owned by `ruff format`.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "F403", "F405", "F841", "F811", "E722", "E741", "E731", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["malva"]

[tool.ty]
[tool.ty.environment]
python-version = "3.11"

# The compiled .pyx modules (barcodes, fast_map, kmer_processing, indexes, ...)
# ship as extension modules with no .pyi stubs, so importing them from tests is
# always "unresolved" to a pure-Python checker. Ignore that single rule; every
# other diagnostic in the checked subset still fails the gate.
[tool.ty.rules]
unresolved-import = "ignore"

# The compiled .pyx modules have no Python stubs, so a whole-repo ty run is
# dominated by false "unresolved import/attribute" noise. Check the subset that
# is real Python and is expected to stay typed clean.
[tool.ty.src]
include = ["tests"]

[tool.deptry]
# build/ holds Cython intermediates; build_scripts/, scripts/ and docs/ are not
# part of the installed package, so they must not drive the dependency set.
extend_exclude = ["build", "build_scripts", "docs", "scripts"]
known_first_party = ["malva"]
# Distribution name -> import name, where deptry cannot infer the mapping.
package_module_name_map = { pyyaml = ["yaml"], scikit-learn = ["sklearn"], scikit-image = ["skimage"], pillow = ["PIL"] }
# tqdm is used by the standalone scripts under scripts/ (excluded above because
# they are not part of the installed package), so deptry cannot see the import.
per_rule_ignores = { DEP002 = ["tqdm"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
